# Builds the Android app (mobile/) and publishes the APK as the "android-latest" release.
name: Android APK

on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk goallive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: goallive-apk
          path: mobile/goallive.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: گل‌لایو برای اندروید
          body: آخرین نسخه اپ اندروید گل‌لایو. فایل goallive.apk را دانلود و نصب کنید.
          prerelease: true
          files: mobile/goallive.apk
