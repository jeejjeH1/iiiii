# Builds the native Android app (android/) and publishes the APK as the "android-latest" release.
name: Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # same signing key from build to build, so a new APK installs over the old one
      - name: Signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: goallive-signing-key-v1
      - name: Store key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.jks; fi
      # the key's public fingerprint, for the Google sign-in client (Android, package app.goallive.live)
      - name: Key fingerprint
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: if [ -f release.jks ]; then keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASS" -alias goallive | grep -E 'SHA1:|SHA256:'; fi
      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -150
          # each Kotlin error also as an annotation, readable from the run's page and API
          grep -E "^e: " build.log | head -30 | sed 's/^e: file:\/\/[^ ]*\/java\///; s/^/::error::/' || true
      - run: cp app/build/outputs/apk/release/app-release.apk goallive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: goallive-apk
          path: android/goallive.apk
      - name: Publish release
        if: github.ref_name == 'ccr-addbae8c-95x58c'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: گل‌لایو برای اندروید
          body: آخرین نسخه اپ اندروید گل‌لایو (اپ بومی). فایل goallive.apk را دانلود و نصب کنید.
          prerelease: true
          files: android/goallive.apk

  # Renders every screen with live data so the app's look can be checked against the website.
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Render screens
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew recordRoborazziDebug --no-daemon 2>&1 | tee test.log | grep --line-buffered -E 'SHOT|FAILED|BUILD|^e: '
      - name: Show test errors
        if: failure()
        run: |
          grep -E "^e: |Exception|Error|FAILED|SHOT" -A3 test.log | head -160
          grep -E "^e: " test.log | head -30 | sed 's/^e: file:\/\/[^ ]*\/java\///; s/^/::error::/' || true
      - name: Publish screenshots
        if: github.ref_name == 'ccr-addbae8c-95x58c'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-screens
          name: Android screenshots (build check)
          body: Automatic screenshots of the Android app from the latest build, used to compare its look with the website.
          prerelease: true
          files: |
            android/app/build/screens/*.png
            android/app/build/screens/*.zip
