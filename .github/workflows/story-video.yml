# Makes the in-app story videos on an Android emulator (the phone's own encoder) and publishes them to look at.
name: Story video check

on:
  push:
    paths: ['android/app/src/main/java/app/goallive/live/ui/Story*.kt', 'android/app/src/main/java/app/goallive/live/ui/Reel.kt', 'android/app/src/androidTest/**', '.github/workflows/story-video.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: story-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Make videos on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          working-directory: android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w app.goallive.live.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            adb logcat -d | grep -E "VIDEO|AndroidRuntime|StoryVideo" | tail -80 || true
            mkdir -p videos
            for n in match ballon player reel; do adb exec-out run-as app.goallive.live cat /sdcard/Android/data/app.goallive.live/files/videos/story-$n.mp4 > videos/story-$n.mp4 || true; done
            adb root || true
            sleep 3
            adb pull /sdcard/Android/data/app.goallive.live/files/videos/. videos/ || true
            grep -q "^OK (" instrument.log
      - name: Video info
        if: always()
        run: |
          find videos -name '*.mp4' -size -50k -delete || true
          ls -laR videos || true
          for f in $(find videos -name '*.mp4'); do ffprobe -v error -show_entries stream=codec_name,width,height,duration,nb_frames -of compact "$f"; done || true
      - name: Publish videos
        if: always() && github.ref_name == 'ccr-addbae8c-95x58c'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: story-videos
          name: Story videos (build check)
          body: Story videos made on an Android emulator by the app's own encoder, from the latest build.
          prerelease: true
          files: android/videos/**/*.mp4
