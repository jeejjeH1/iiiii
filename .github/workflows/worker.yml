# Puts the GoalLive API (worker/) on Cloudflare Workers.
# Needs the CLOUDFLARE_API_TOKEN secret (permission: Account → Workers Scripts → Edit); CLOUDFLARE_ACCOUNT_ID is optional.
name: Cloudflare server

on:
  push:
    paths: ['worker/**', 'api/**', 'lib/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Account
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
            [ -n "$id" ] || { echo "No Cloudflare account found for this key"; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          fi
      - name: Deploy
        run: npx -y wrangler@4 deploy 2>&1 | tee deploy.log
      # the dashboard's password (/t/dash?key=…), when the DASH_KEY secret is set
      - name: Dashboard key
        env:
          DASH_KEY: ${{ secrets.DASH_KEY }}
        run: if [ -n "$DASH_KEY" ]; then printf '%s' "$DASH_KEY" | npx -y wrangler@4 secret put DASH_KEY; else echo "no DASH_KEY secret yet"; fi
      # the prediction league's SMS (sms.ir): the API key, and the template id and its parameter when they are set
      - name: SMS keys
        env:
          SMSIR_KEY: ${{ secrets.SMSIR_KEY }}
          SMSIR_TEMPLATE: ${{ secrets.SMSIR_TEMPLATE }}
          SMSIR_PARAM: ${{ secrets.SMSIR_PARAM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          for k in SMSIR_KEY SMSIR_TEMPLATE SMSIR_PARAM GOOGLE_CLIENT_ID; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx -y wrangler@4 secret put "$k"; else echo "no $k secret (the league runs in test mode without SMSIR_KEY)"; fi
          done
      - name: Check
        env:
          DASH: ${{ secrets.DASH_KEY }}
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Server: $url"
          d=$(TZ=Asia/Tehran date +%Y%m%d)
          for p in /v1 /v1/leagues?lang=fa "/v1/matches?date=today&lang=fa" /v1/live /v1/leagues/523/table?lang=fa /v1/teams/101610 /v1/players/30981 "/v1/search?q=persepolis" / "/api/fm?e=matches&date=$d&timezone=Asia/Tehran" /api/fm?e=tltable\&leagueId=47 /api/fm?e=suggest\&term=persepolis /api/today /api/widget?team=8634 /api/hl?q=goal "/api/tts?t=hello&v=ryan"; do
            curl -s "$url$p" -o out -w "%{http_code} %{size_download}B  $p\n"; head -c 160 out | tr -d '\0' ; echo
          done
          # telemetry: a test batch goes in (its device id is all zeros, so it is easy to spot) and the dashboard answers
          curl -s -X POST "$url/t/up" -H 'content-type: application/json' -w " %{http_code} /t/up\n" \
            -d "{\"d\":\"00000000-0000-0000-0000-000000000000\",\"v\":\"ci\",\"sdk\":34,\"m\":\"CI\",\"l\":\"fa\",\"days\":{\"$(date +%F)\":{\"open\":1}}}"
          curl -s "$url/t/dash" -o /dev/null -w "%{http_code} /t/dash (503 until DASH_KEY is set, 403 with it)\n"
          # the league: an account, and whether sms.ir answers this server (its credit, never a message)
          # a test account: a fantasy league made, listed and its table read, then the account deleted
          tok=$(curl -s -X POST "$url/p/guest" -H 'content-type: application/json' -d '{"name":"CI"}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          echo "guest: ${tok:+ok}"
          if [ -n "$tok" ]; then
            A="authorization: Bearer $tok"
            fid=$(curl -s -X POST "$url/p/fleagues" -H "$A" -H 'content-type: application/json' -d '{"name":"CI fantasy","comp":47}' | tee /dev/stderr | python3 -c "import sys,json;print(json.load(sys.stdin)['league']['id'])" || true)
            curl -s "$url/p/fleagues?comp=47" -H "$A" -w "  /p/fleagues\n"
            curl -s "$url/p/fleague?id=$fid" -H "$A" -w "  /p/fleague\n"
            curl -s "$url/p/fleague?id=0&comp=47" -H "$A" -w "  /p/fleague everyone\n"
            curl -s -X POST "$url/p/fpoints" -H "$A" -H 'content-type: application/json' -d '{"comp":47,"round":"1","pts":10}' -w "  /p/fpoints (404 without a team)\n"
            curl -s -X POST "$url/p/delete" -H "$A" -H 'content-type: application/json' -d '{}' -w "  /p/delete\n"
          fi
          if [ -n "$DASH" ]; then curl -s "$url/p/sms?key=$DASH" -w "  /p/sms\n"; fi
          # Google sign-in: on once the GOOGLE_CLIENT_ID secret is set (the client id is public)
          curl -s "$url/p/config" -w "  /p/config\n"
          curl -sf "$url/api/fm?e=suggest&term=persepolis" -o /dev/null
          curl -sf "$url/v1/matches?date=today" -o /dev/null
          curl -sf "$url/v1/leagues/47/table" -o /dev/null
