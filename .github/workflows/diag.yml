name: diag
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[diag]')
    steps:
      - run: |
          for u in "/" "/api/fm?e=matches&date=20261023&timezone=Asia/Tehran&ccode3=IRN" "/api/fm?e=teams&id=101611&ccode3=IRN" "/api/widget?team=8634" "/api/today" "/api/tts?t=salam"; do
            echo "== $u"; curl -s -o /tmp/o -w "%{http_code} %{size_download}B %{time_total}s\n" "https://iiiii-psi.vercel.app$u"; head -c 200 /tmp/o; echo
          done
          curl -sI https://iiiii-psi.vercel.app/ | head -20
