# One-off diagnostics for the highlights feature (safe to delete).
name: Diagnose highlights
on:
  push:
    paths: ['.github/workflows/diag.yml']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new deployment
        run: sleep 90
      - name: Fenerbahce - Slavia (yesterday)
        run: curl -sS -m 40 -w '\nHTTP %{http_code}\n' "https://iiiii-psi.vercel.app/api/hl?q=%D8%AE%D9%84%D8%A7%D8%B5%D9%87%20%D8%A8%D8%A7%D8%B2%DB%8C%20%D9%81%D9%86%D8%B1%D8%A8%D8%A7%D8%BA%DA%86%D9%87%20%D8%A7%D8%B3%D9%84%D8%A7%D9%88%DB%8C%D8%A7%20%D9%BE%D8%B1%D8%A7%DA%AF&must=%D9%81%D9%86%D8%B1%D8%A8%D8%A7%D8%BA%DA%86%D9%87%7C%D8%A7%D8%B3%D9%84%D8%A7%D9%88%DB%8C%D8%A7%20%D9%BE%D8%B1%D8%A7%DA%AF&after=1792514700000" | head -c 2500
      - name: Man City - AEK (yesterday)
        run: curl -sS -m 40 -w '\nHTTP %{http_code}\n' "https://iiiii-psi.vercel.app/api/hl?q=%D8%AE%D9%84%D8%A7%D8%B5%D9%87%20%D8%A8%D8%A7%D8%B2%DB%8C%20%D9%85%D9%86%DA%86%D8%B3%D8%AA%D8%B1%D8%B3%DB%8C%D8%AA%DB%8C%20AEK%20Athens&must=%D9%85%D9%86%DA%86%D8%B3%D8%AA%D8%B1%D8%B3%DB%8C%D8%AA%DB%8C%7CAEK%20Athens&after=1792522800000" | head -c 2500
