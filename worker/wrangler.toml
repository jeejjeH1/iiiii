# GoalLive's server on Cloudflare Workers: the /api functions only (same code as api/*.js).
# Deployed by .github/workflows/worker.yml with the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets.
name = "goallive"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# crash reports and anonymous usage counts from the app (src/telemetry.js); the dashboard needs the DASH_KEY secret
[[durable_objects.bindings]]
name = "TELEMETRY"
class_name = "Telemetry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Telemetry"]

# the prediction league (src/league.js): accounts, picks and private leagues; the sms.ir key is the SMSIR_KEY secret
[[durable_objects.bindings]]
name = "LEAGUE"
class_name = "League"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["League"]

# final scores for the league tables
[triggers]
crons = ["*/10 * * * *"]
