<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GenLayer Cat Turnaround</title>
<style>html,body{margin:0;background:#282828}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createCharacter } from './character.js';
import { ToonPipeline } from './toon.js';

// Orthographic views framed exactly like the reference crops (400 px per unit).
const VIEWS = {
  front: { w: 1300, h: 1620, l: -648 / 400, r: (1300 - 648) / 400, pos: [0, 0, 20], pose: 'hero' },
  side: { w: 1000, h: 1620, l: -1.2, r: 1.3, pos: [20, 0, 0], pose: 'rest' },
  back: { w: 1100, h: 1620, l: -542 / 400, r: (1100 - 542) / 400, pos: [0, 0, -20], pose: 'rest' },
  hero34: { w: 1300, h: 1620, persp: true, pos: [4.6, 2.9, 9.2], pose: 'hero' },
};
const top = 1550 / 400, bottom = -70 / 400;

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 2.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#282828');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const hemi = new THREE.HemisphereLight('#ffffff', '#7a7090', 0.45); scene.add(hemi);
const key = new THREE.DirectionalLight('#ffffff', 0.62); key.position.set(2, 6, 8); scene.add(key);
const fill = new THREE.DirectionalLight('#ffffff', 0.18); fill.position.set(-6, 2, -4); scene.add(fill);
window.lights = { hemi, key, fill };

const cat = createCharacter();
scene.add(cat.root);
window.cat = cat;

let pipe = null, size = null;
window.renderView = (name, opts = {}) => {
  const V = VIEWS[name];
  if (!size || size[0] !== V.w || size[1] !== V.h) {
    renderer.setSize(V.w, V.h, false);
    size = [V.w, V.h];
    pipe = null;
  }
  let cam;
  if (V.persp) {
    cam = new THREE.PerspectiveCamera(26, V.w / V.h, 0.1, 100);
    cam.position.set(...V.pos); cam.lookAt(0, 1.85, 0);
  } else {
    cam = new THREE.OrthographicCamera(V.l, V.r, top, bottom, 0.1, 60);
    cam.position.set(V.pos[0], 0, V.pos[2]);
    cam.lookAt(0, 0, 0);
    cam.position.y = 0; // keep frame vertical as in the sheet
  }
  if (!pipe) pipe = new ToonPipeline(renderer, scene, cam, { width: V.w, height: V.h, lineWidth: opts.line ?? 3.0 });
  pipe.setCamera(cam); window.pipe = pipe; window.renderer = renderer;
  if (V.pose === 'hero') cat.poseHero(); else cat.poseRest();
  cat.face.draw({ expr: 'angry' });
  pipe.render();
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
